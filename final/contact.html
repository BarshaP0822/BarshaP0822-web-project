<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact GreenTech Solutions</title>

    <link rel="stylesheet" href="../css/final.css">
</head>

<body>

    <header>

        <h1>GreenTech Solutions</h1>
        
        <nav>
            <a href="final-index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="resources.html">Resources</a>
            <a href="contact.html">Contact</a>
        </nav>
    
    </header>
    <main> 

        <section class="contact">

            <h2>Contact Us</h2>

            <p>
            Contact us for more information about our products and services</p>
        </section>

        <section class="contact-info">

            <h3> Company Information</h3>

            <p>Email: info@greentechsolutions.com</p>

            <p> Phone: (575) 123-4567</p>
            <p> Address: 143 Nature st. Clovis, New Mexico </p>

        </section>

        <section class="form-section">

            <h3>Contact us</h3>
            <form id="contactForm">

            <label for="name">Name</label>

            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>

            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>

            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit</button>
            </form>
            <p id="formMessage"></p>

        </section>
    
    </main>
    <script src="../javascript/final.js"></script>

</body>
</html>
